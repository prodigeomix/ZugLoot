name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  # Headless suite: pure-logic tests + mock-client UI run + Lua 5.0 gate.
  # 5.1 tracks the 1.12 client most closely; 5.4 keeps us honest on modern
  # interpreters. Must run from the repo root (tests dofile() siblings).
  test-5-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: lua5.1 -v
      - run: lua5.1 tests/run_tests.lua

  test-5-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: lua5.4 -v
      - run: lua5.4 tests/run_tests.lua

  # WoW-aware lint (see .luacheckrc): undefined globals stay strict —
  # a typo'd global is a silent nil on the client.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck via LuaRocks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 luarocks liblua5.1-0-dev
          sudo luarocks install luacheck
      - run: luacheck --version
      - run: luacheck .

  # Runtime Invariants & LLM Acceptance Gates (GATES.md):
  # Enforces hard MTU bounds (254B), corpse slot reconciliation,
  # Lua 5.0 memory churn limits, and fuzz resilience so LLM-generated
  # code cannot regress low-level client safety invariants.
  acceptance-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Gate 1 - Global Guard & Lua 5.0 Compatibility
        run: node tests/run.mjs tests/test_global_guard.lua
      - name: Gate 2 - Network MTU (254B) & Throttle Discipline
        run: node tests/run.mjs tests/test_network_mtu_throttle.lua
      - name: Gate 3 - Corpse Slot Shift & Candidate Invariants
        run: node tests/run.mjs tests/test_corpse_slot_shift.lua
      - name: Gate 4 - Deserialization Fuzzing & Injection Defense
        run: node tests/run.mjs tests/test_fuzz_deserialization.lua
      - name: Gate 5 - Memory Churn & SavedVariables Bounds
        run: node tests/run.mjs tests/test_memory_churn_bounds.lua

  # Release zips (only runs on version tags like v0.2.0): the zip holds
  # exactly what the client loads — toc + shipped lua + Media assets.
  # Left out: tests/, CustomData_example/ (test fixtures only),
  # .luacheckrc, docs, .github, and (by construction) all .git* files.
  # The zip extracts to a single ZugLoot/ folder (drop into Interface/AddOns).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches addon version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## Version: $TAG$" ZugLoot.toc || { echo "toc version != tag $TAG"; exit 1; }
          grep -q "^ZugLoot.VERSION = \"$TAG\"$" Constants.lua || { echo "Constants VERSION != tag $TAG"; exit 1; }
          echo "version $TAG ok"
      - name: Stage addon files
        run: |
          rm -rf pkg "ZugLoot-${GITHUB_REF_NAME}.zip"
          mkdir -p pkg/ZugLoot/Media
          cp ZugLoot.toc ./*.lua pkg/ZugLoot/
          cp Media/*.tga Media/*.ttf pkg/ZugLoot/Media/
          echo "--- staged:"; find pkg | sort
      - name: Build zip
        run: |
          cd pkg && zip -r "../ZugLoot-${GITHUB_REF_NAME}.zip" ZugLoot
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ZugLoot $GITHUB_REF_NAME" \
            --generate-notes "ZugLoot-${GITHUB_REF_NAME}.zip"
